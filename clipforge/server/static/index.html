<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#12161f; --panel2:#1a2029; --line:#242c38;
    --text:#d6dde8; --dim:#7d8aa0; --accent:#4fd1c5; --warn:#f6ad55;
    --good:#68d391; --bad:#fc8181;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    font-size:14px; height:100vh; display:flex; flex-direction:column;
  }
  header {
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px;
  }
  header h1 { font-size:16px; letter-spacing:2px; color:var(--accent); }
  header .metrics { color:var(--dim); font-size:12px; margin-left:auto; }
  main { flex:1; display:flex; min-height:0; }
  #sidebar {
    width:290px; border-right:1px solid var(--line); overflow-y:auto;
    padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  .upload {
    border:1px dashed var(--line); border-radius:8px; padding:14px;
    text-align:center; color:var(--dim); cursor:pointer;
  }
  .upload:hover { border-color:var(--accent); color:var(--accent); }
  .job {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; cursor:pointer;
  }
  .job.active { border-color:var(--accent); }
  .job .name { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .stage { font-size:11px; color:var(--dim); margin-top:4px; }
  .job .stage.failed { color:var(--bad); }
  #detail { flex:1; overflow-y:auto; padding:20px; }
  .stagebar { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .stagebar span {
    font-size:11px; padding:4px 10px; border-radius:20px;
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
  }
  .stagebar span.done { color:var(--good); border-color:var(--good); }
  .stagebar span.now  { color:var(--warn); border-color:var(--warn); }
  .clipgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  .clip {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .clip video { width:100%; border-radius:8px; background:#000; aspect-ratio:9/16; max-height:420px; }
  .clip .hook { color:var(--text); font-size:13px; }
  .clip .meta { color:var(--dim); font-size:11px; line-height:1.6; }
  .score { color:var(--accent); font-weight:bold; }
  .btnrow { display:flex; gap:8px; }
  button {
    font-family:inherit; font-size:12px; padding:8px 14px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  button.approve.on { background:#173a2c; border-color:var(--good); color:var(--good); }
  button.reject.on  { background:#3a1717; border-color:var(--bad); color:var(--bad); }
  .trim { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--dim); }
  .trim input {
    width:76px; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); font-family:inherit; font-size:11px; padding:5px 6px;
    border-radius:5px;
  }
  .empty { color:var(--dim); margin-top:40px; text-align:center; }
  .err { color:var(--bad); font-size:12px; margin-bottom:12px; white-space:pre-wrap; }
  a.qa { color:var(--dim); font-size:11px; }
  #exportbar { margin:16px 0; display:flex; gap:10px; align-items:center; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>CLIPFORGE</h1>
  <span id="jobcount" style="color:var(--dim);font-size:12px"></span>
  <span class="metrics" id="globalmetrics"></span>
</header>
<main>
  <div id="sidebar">
    <div class="upload" id="uploadbox">+ upload long-form video</div>
    <input type="file" id="file" accept="video/*" style="display:none">
    <div id="joblist"></div>
  </div>
  <div id="detail"><div class="empty">select or upload a video →</div></div>
</main>
<script>
const $ = s => document.querySelector(s);
const STAGES = ["ingested","transcribed","candidates_ready","refined","reframed","rendered"];
let currentJob = null, pollTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

// ---------- upload ----------
$("#uploadbox").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("#uploadbox").textContent = "uploading…";
  const fd = new FormData(); fd.append("file", f);
  try {
    const {job_id} = await api("/api/jobs", {method:"POST", body:fd});
    currentJob = job_id;
  } catch (err) { alert(err.message); }
  $("#uploadbox").textContent = "+ upload long-form video";
  refresh();
};

// ---------- job list ----------
async function refresh() {
  const jobs = await api("/api/jobs");
  $("#jobcount").textContent = jobs.length + " jobs";
  $("#joblist").innerHTML = jobs.map(j => `
    <div class="job ${j.job_id===currentJob?"active":""}" onclick="openJob('${j.job_id}')">
      <div class="name">${j.filename}</div>
      <div class="stage ${j.failed?"failed":""}">
        ${j.failed ? "FAILED" : j.stage}${j.progress && j.stage!=="rendered" ? " · "+j.progress : ""}
        · ${Math.round(j.duration)}s
      </div>
    </div>`).join("");
  const gm = await api("/api/metrics");
  $("#globalmetrics").textContent = gm.total_reviewed
    ? `approval ${(gm.overall_approval_rate*100).toFixed(0)}% · avg trim ${gm.avg_trim_adjustment_sec}s · ${gm.total_reviewed} reviewed`
    : "";
  if (currentJob) renderDetail();
}

window.openJob = id => { currentJob = id; refresh(); };

// ---------- detail ----------
async function renderDetail() {
  const j = await api("/api/jobs/" + currentJob);
  const doneIdx = STAGES.indexOf(j.stage);
  const bar = STAGES.map((s,i) =>
    `<span class="${i<=doneIdx?"done":(i===doneIdx+1&&!j.failed?"now":"")}">${s}</span>`).join("");
  let html = `<div class="stagebar">${bar}</div>`;
  if (j.failed) html += `<div class="err">stage failed: ${j.error}
<button onclick="rerun()">retry pipeline</button></div>`;
  else if (j.stage !== "rendered")
    html += `<div class="err" style="color:var(--warn)">${j.progress || "working…"}</div>`;

  if (j.clips.length) {
    const m = j.metrics;
    html += `<div id="exportbar">
      job metrics: ${m.reviewed}/${j.clips.length} reviewed
      ${m.approval_rate!==null ? "· approval "+(m.approval_rate*100).toFixed(0)+"%" : ""}
      · avg trim ${m.avg_trim_adjustment_sec}s
      <button onclick="exportExamples()">export approved → few-shot examples</button>
    </div>`;
    html += `<div class="clipgrid">` + j.clips.map(c => clipCard(c)).join("") + `</div>`;
  } else if (j.stage === "rendered") {
    html += `<div class="empty">pipeline found no strong clips in this video</div>`;
  }
  $("#detail").innerHTML = html;
}

function clipCard(c) {
  const r = c.review;
  return `<div class="clip">
    ${c.video_ready
      ? `<video controls preload="metadata" src="/api/jobs/${currentJob}/clips/${c.id}/video"></video>`
      : `<div class="meta">rendering…</div>`}
    <div class="hook">“${c.hook}”</div>
    <div class="meta">
      <span class="score">score ${c.score}</span> · ${c.type} · ${c.duration}s
      · ${c.start.toFixed(1)}s → ${c.end.toFixed(1)}s<br>${c.reason}
      ${c.video_ready ? ` · <a class="qa" href="/api/jobs/${currentJob}/clips/${c.id}/qa" target="_blank">QA sheet</a>` : ""}
    </div>
    <div class="trim">
      trim: <input id="ts${c.id}" placeholder="start" value="${r?.adjusted_start ?? ""}">
      <input id="te${c.id}" placeholder="end" value="${r?.adjusted_end ?? ""}">
      <input id="tn${c.id}" placeholder="note" style="flex:1" value="${r?.note ?? ""}">
    </div>
    <div class="btnrow">
      <button class="approve ${r?.decision==="approved"?"on":""}"
        onclick="review(${c.id},'approved')">✓ approve</button>
      <button class="reject ${r?.decision==="rejected"?"on":""}"
        onclick="review(${c.id},'rejected')">✗ reject</button>
    </div>
  </div>`;
}

window.review = async (cid, decision) => {
  const g = id => { const v = $(id).value.trim(); return v === "" ? null : parseFloat(v); };
  await api(`/api/jobs/${currentJob}/clips/${cid}/review`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({decision,
      adjusted_start:g(`#ts${cid}`), adjusted_end:g(`#te${cid}`),
      note: $(`#tn${cid}`).value})
  });
  refresh();
};

window.rerun = async () => { await api(`/api/jobs/${currentJob}/rerun`, {method:"POST"}); refresh(); };
window.exportExamples = async () => {
  const r = await api(`/api/jobs/${currentJob}/export-examples`, {method:"POST"});
  alert(`wrote ${r.written.length} example file(s) to ${r.examples_dir}`);
};

refresh();
pollTimer = setInterval(refresh, 4000);
</script>
</body>
</html>
