name: tests

on:
  push:
  pull_request:

jobs:
  # Linux runs the suite twice: against Ubuntu's ffmpeg (6.1, the oldest we
  # support) and against a current static build (BtbN master, 8.x), so an
  # option removed in one release or a changed output format is caught.
  test:
    name: test (ffmpeg ${{ matrix.ffmpeg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: [distro, current]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Installed in both legs; in the "current" leg the static build below is
      # put first on PATH and shadows it.
      - name: Install ffmpeg (with libass for captions)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Deliberately the moving "latest" build: this leg exists to catch the
      # next ffmpeg change early. (Pinning an autobuild tag needs the GitHub
      # releases API, which was not reachable when this was written.) The
      # tarball is checked against the sha256 the same release publishes, so a
      # truncated or mixed-up download fails here rather than as odd test errors.
      - name: Install current static ffmpeg (BtbN master build)
        if: matrix.ffmpeg == 'current'
        run: |
          set -euo pipefail
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          tarball=ffmpeg-master-latest-linux64-gpl.tar.xz
          dest="$RUNNER_TEMP/ffmpeg-current"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "$dest/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$dest/checksums.sha256" "$base/checksums.sha256"
          (cd "$dest" && grep " $tarball\$" checksums.sha256 | sha256sum -c -)
          tar -xJf "$dest/$tarball" -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Show ffmpeg version
        run: |
          which ffmpeg ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-github-actions-annotate-failures

      - name: Lint (pyflakes)
        run: python -m pyflakes clipforge tests

      - name: Run tests (offline, mock engines)
        env:
          CLIPFORGE_ASR: mock
          CLIPFORGE_HL: mock
          CLIPFORGE_DETECTOR: haar
        run: python -m pytest tests/ -q

  # Diego develops on Windows, where Python's default text encoding is cp1252.
  # This job keeps that platform honest. ffmpeg comes from Chocolatey; it must
  # include libass for the caption tests, which the "essentials/full" builds do.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Show ffmpeg version
        run: |
          (ffmpeg -version)[0]
          (ffprobe -version)[0]

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-github-actions-annotate-failures

      # No PYTHONUTF8 here on purpose: the default Windows encoding is the point.
      - name: Run tests (offline, mock engines)
        env:
          CLIPFORGE_ASR: mock
          CLIPFORGE_HL: mock
          CLIPFORGE_DETECTOR: haar
        run: python -m pytest tests/test_server.py tests/test_ui_static.py tests/test_encoding.py tests/test_cli_preflight.py tests/test_ffmpeg_compat.py -q
